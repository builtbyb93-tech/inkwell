name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 11.25.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:validate
      - run: pnpm release:compose-check

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
        env:
          POSTGRES_USER: inkwell
          POSTGRES_PASSWORD: inkwell_ci_only
          POSTGRES_DB: inkwell_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inkwell -d inkwell_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        ports: ['11025:1025', '18025:8025']
    env:
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 11025
      SMTP_FROM: no-reply@example.test
      MAILPIT_URL: http://127.0.0.1:18025
      DATABASE_URL: postgresql://inkwell:inkwell_ci_only@127.0.0.1:5432/inkwell_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 11.25.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Start isolated private S3
        run: node scripts/storage-local.mjs
        env:
          COMPOSE_PROJECT_NAME: inkwell_ci_storage
          S3_BUCKET: inkwell-ci
          S3_PORT: 13906
      - run: pnpm test:integration
      - run: pnpm test:backup

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
        env:
          POSTGRES_USER: inkwell
          POSTGRES_PASSWORD: inkwell_ci_only
          POSTGRES_DB: inkwell_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inkwell -d inkwell_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        ports: ['11025:1025', '18025:8025']
    env:
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 11025
      SMTP_FROM: no-reply@example.test
      MAILPIT_URL: http://127.0.0.1:18025
      DATABASE_URL: postgresql://inkwell:inkwell_ci_only@127.0.0.1:5432/inkwell_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 11.25.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm build
      - name: Start isolated private S3
        run: node scripts/storage-local.mjs
        env:
          COMPOSE_PROJECT_NAME: inkwell_ci_storage
          S3_BUCKET: inkwell-ci
          S3_PORT: 13906
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: browser-failures, path: 'playwright-report/', retention-days: 7 }

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/Dockerfile -t inkwell:ci .
      - name: Verify restricted non-root runtime and liveness
        run: |
          test "$(docker image inspect inkwell:ci --format '{{.Config.User}}')" = node
          docker run --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --detach --name inkwell-ci --publish 127.0.0.1:3300:3000 inkwell:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3300/api/v1/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - if: always()
        run: docker rm --force inkwell-ci || true

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 11.25.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - run: pnpm audit --audit-level=high
